<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.name === 'Canceled' || event.reason.type === 'cancelation' || event.reason.message === 'Canceled' || event.reason.message === 'operation is manually canceled' || (event.reason.msg && event.reason.msg === 'operation is manually canceled'))) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true); // Use capture phase to intercept before Vite!

      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (args.length > 0) {
          const firstArg = args[0];
          if (typeof firstArg === 'object' && firstArg !== null && (firstArg.type === 'cancelation' || firstArg.name === 'Canceled')) {
            return;
          }
          if (typeof firstArg === 'string' && (firstArg.includes('operation is manually canceled') || firstArg.includes('Canceled'))) {
            return;
          }
        }
        originalConsoleError.apply(console, args);
      };
    </script>
